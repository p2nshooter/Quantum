name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build for Cloudflare
        run: npm run cf:build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quantum_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # seed.sql dibuat di CI (tidak pernah masuk repo) karena berisi hash
      # password admin. Password plaintext hanya ada sebagai secret GitHub dan
      # tidak pernah tertulis ke disk repo maupun log.
      - name: Generate seed file
        run: npm run generate:seed
        env:
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}

      # Dijalankan sebagai SQL biasa (bukan migrasi terlacak) supaya setiap
      # deploy menerapkannya ulang. Semua INSERT memakai OR IGNORE dengan id
      # tetap, jadi data yang sudah diubah lewat panel tidak tertimpa —
      # termasuk kalau admin sudah mengganti passwordnya sendiri.
      - name: Seed master data
        run: npx wrangler d1 execute quantum_db --remote --file=./seed/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Secret opsional; dilewati diam-diam bila belum diisi di GitHub.
      - name: Sync optional Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          set -e
          if [ -n "$NOTIFY_WEBHOOK_URL" ]; then
            printf '%s' "$NOTIFY_WEBHOOK_URL" | npx wrangler secret put NOTIFY_WEBHOOK_URL
          else
            echo "NOTIFY_WEBHOOK_URL belum diisi, dilewati."
          fi
